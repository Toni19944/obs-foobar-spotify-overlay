<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing — Spotify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --card-bg:         rgba(0, 0, 0, 0.97);
    --card-border:     rgba(255, 255, 255, 0.13);
    --card-blur:       22px;
    --card-radius:     20px;
    --card-padding-x:  28px;
    --card-padding-y:  18px;
    --card-width:      340px;
    --img-opacity:     0.24;
    --img-blur:        2px;
    --img-scale:       1.06;
    --color-artist:    rgba(255, 255, 255, 0.58);
    --color-track:     rgba(255, 255, 255, 0.69);
    --color-timer:     rgba(255, 255, 255, 0.45);
    --color-bar-bg:    rgba(255, 255, 255, 0.00);
    --color-bar-fill:  rgba(255, 255, 255, 0.57);
    --marquee-speed:   22s;
    --font-artist: 'Syne', sans-serif;
    --font-track:  'DM Sans', sans-serif;
    --font-timer:  'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── GLOW WRAPPER ─────────────────────────────────────────────
     Wraps the card so the canvas visualizer sits over it */
  .card-wrap {
    position: relative;
    border-radius: var(--card-radius);
    overflow: hidden;
  }

  /* ── MIRROR STAGE ─────────────────────────────────────────────
     Positioning context for the outward mirror canvas. That canvas
     cannot live inside .card-wrap: .card-wrap's overflow:hidden is
     exactly the clip that crops the inner glow to the card edge, and
     that clip stays. Inert when the mirror is off — position:relative
     and nothing else, so it has no layout effect of its own. Must never
     gain overflow, transform, filter, or contain — any of those would
     clip the mirror or reparent it into a new stacking context and break
     the outward bleed. */
  .stage { position: relative; }

  #vis-mirror {
    position: absolute;
    pointer-events: none;
    /* opacity and filter are set at runtime from CONFIG.MIRROR_* when the
       mirror layer is created; left/top/width/height are set as percentages
       in visResize() (not inset — see that function for why) */
  }

  #vis-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
    border-radius: var(--card-radius);
    /* (#1) GPU-composited blur + brightness instead of per-stroke ctx.filter */
    filter: var(--vis-filter, blur(12px) brightness(1.6));
  }

  .card {
    position: relative;
    overflow: hidden;
    border-radius: var(--card-radius);
    border: 0.5px solid var(--card-border);
    background: var(--card-bg);
    /* backdrop-filter applied at runtime from CONFIG.CARD_BACKDROP_BLUR (see script) */
    padding: var(--card-padding-y) var(--card-padding-x);
    width: var(--card-width);
    height: var(--card-height);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
    opacity: 0;
    transform: translateY(5px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .card.visible { opacity: 1; transform: translateY(0); }

  .bg-layer { position: absolute; inset: 0; z-index: 0; pointer-events: none; }

  .bg-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.9s ease;
    will-change: transform, filter;
  }

  .bg-img.active { opacity: var(--img-opacity); }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .marquee-clip { overflow: hidden; width: 100%; }
  .marquee-clip.scrolling {
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 1%, black 98%, transparent 100%);
    mask-image:         linear-gradient(to right, transparent 0%, black 1%, black 98%, transparent 100%);
  }

  @keyframes marquee-bounce {
    0%   { transform: translateX(0); }
    10%  { transform: translateX(0); }
    45%  { transform: translateX(var(--marquee-offset)); }
    55%  { transform: translateX(var(--marquee-offset)); }
    90%  { transform: translateX(0); }
    100% { transform: translateX(0); }
  }

  .marquee-clip.scrolling .inner {
    animation: marquee-bounce var(--marquee-speed) ease-in-out infinite;
  }

  .artist {
    font-family: var(--font-artist);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-artist);
    white-space: nowrap;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    transition: opacity 0.15s ease;
    font-variant-numeric: lining-nums;
  }

  .middle-row { display: flex; align-items: center; gap: 10px; }

  .progress-bar {
    flex: 1;
    height: 2px;
    background: var(--color-bar-bg);
    border-radius: 2px;
    overflow: hidden;
    margin-left: auto;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--color-bar-fill);
    border-radius: 2px;
    transition: width 1s linear;
  }

  .timer {
    font-family: var(--font-timer);
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.05em;
    color: var(--color-timer);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }

  .track {
    font-family: var(--font-track);
    font-size: 16px;
    font-weight: 500;
    color: var(--color-track);
    white-space: nowrap;
    text-shadow: 0 0px 8px rgba(0,0,0,0.77);
    transition: opacity 0.15s ease;
  }

  .fade-out { opacity: 0 !important; }
</style>
</head>
<body>

<!-- .stage is the positioning context for the outward mirror canvas (#vis-mirror,
     created at runtime only when the mirror is enabled). It is inert otherwise. -->
<div class="stage" id="stage">
  <!-- Wrapper exists so box-shadow glow isn't clipped by card's overflow:hidden -->
  <div class="card-wrap" id="card-wrap">
    <!-- Spectrum canvas — sits over the card border, pointer-events:none -->
    <canvas id="vis-canvas"></canvas>
    <div class="card" id="card">
      <div class="bg-layer">
        <img class="bg-img" id="bg-a" src="" alt="" decoding="async">
        <img class="bg-img" id="bg-b" src="" alt="" decoding="async">
      </div>
      <div class="content">
        <div class="marquee-clip" id="artist-clip">
          <div class="inner artist" id="artist">Artist</div>
        </div>
        <div class="middle-row">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="timer" id="timer">0:00 / 0:00</div>
        </div>
        <div class="marquee-clip" id="track-clip">
          <div class="inner track" id="track">Track Title</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  // ── METADATA ADAPTER (Spotify) ── start
  //   Supplies now-playing data + album art. Reference uses Beefweb here.
  ENDPOINT:     'http://localhost:8081/api/spotify/current',  // 8081 = server serve port (8082 is OAuth callback only — FR-008)
  ALBUM_ART_BG: false,  // Spotify album art as card background; mutually exclusive with IMAGES; default off so defaults match the reference (FR-011)
  VIS_GAIN:     1.0,    // static visualizer gain — Spotify exposes no playback volume, so this replaces the reference's dynamic gain (FR-019)
  // ── METADATA ADAPTER (Spotify) ── end
  POLL_MS:   1000,
  DEMO_MODE: false,
  IMAGES:    false,

  // ── CARD GLASS (backdrop-filter) ─────────────────────────────
  // Frosted-glass blur behind the card. OFF by default for gaming
  // streams: it re-blurs the full card backdrop every frame the scene
  // behind the overlay changes — the overlay's heaviest GPU cost
  // (audit finding F-017). Turn ON for music-specific streams or larger
  // overlay cards where the glass actually reads. Radius = --card-blur (22px).
  CARD_BACKDROP_BLUR: false,

  // ── VISUALIZER ────────────────────────────────────────────────
  //  Connects to spectrum-server.py (ws://localhost:9001) and
  //  drives the border visualizer with real FFT frequency data.
  //
  //  SETUP:
  //  Run spectrum-server.py before launching OBS.
  //
  VISUALIZER:        true,
  SPECTRUM_PORT:     9001,
  VIS_COLOR:         '255, 255, 255',
  VIS_MAX_OPACITY:   0.93,
  VIS_BAR_DEPTH:     22,
  VIS_BLUR:          12,
  VIS_BRIGHTNESS:    1.8,     // post-blur brightness multiplier — restores glow intensity lost to CSS blur spread (1.0 = none, 1.6 ≈ original ctx.filter look)
  VIS_SMOOTHING:     0.25,
  VIS_BANDS:         44,
  
  // ── BACKGROUND FFT MOTION (independent from visualizer) ──────
  // Separate smoothing/band logic from the visualizer.
  // This only affects the background image and does not touch the
  // existing glow/visualizer system in any way.
  BG_MOTION: false,
  BG_MOTION_TARGET: 'image',  // 'image' (default) or 'card' — see bgMotionTarget URL flag
  BG_MOTION_BANDS: 6,          // group server FFT into 6 broad bands
  BG_BASE_BLUR: 0.10,          // extra blur always present on top of --img-blur
  BG_BLUR_MAX_ADD: 0.83,       // FFT blur modulation stays very small
  BG_ZOOM_MAX_ADD: 0.40,      // ~1.8% max extra zoom from FFT
  BG_BASELINE_ZOOM: 0.025,    // slow continuous "breathing"
  BG_ZOOM_SMOOTH: 0.032,       // slow inertia for cinematic zoom
  BG_BLUR_SMOOTH: 0.032,       // slightly faster inertia for blur
  BG_DELAY_SMOOTH: 0.020,      // intentional lag vs foreground glow
  BG_MICRO_SMOOTH: 0.045,      // heavily smoothed high-band micro motion
  // 'card' target only. Deliberately NOT backdrop-filter — that only
  // samples content actually behind the element WITHIN the page, and this
  // page has nothing there (transparent body); it cannot reach through to
  // whatever OBS composites underneath a transparent browser source, so it
  // never reliably rendered in OBS. Also deliberately NOT `filter:
  // brightness()` — that's MULTIPLICATIVE (scales existing RGB by X), and
  // the card's background is pure black (rgba(0,0,0,...)); 0 * anything
  // is still 0, so it could never visibly brighten the card regardless of
  // amplitude. This is an ADDITIVE inset glow instead (box-shadow), which
  // paints real light onto the black background rather than trying to
  // scale it — `inset` so it can't be clipped by card-wrap's overflow:
  // hidden the way an outward glow could.
  // Driven by bgDelayedMid (the same smoothed FFT mid-band signal as the
  // image-mode blur, already delay-smoothed via BG_DELAY_SMOOTH) rather
  // than a sharp peak-follower — a gentle continuous wash, not a flash on
  // every transient.
  // Reach (blur+spread) is FIXED, not scaled by the signal — bgDelayedMid
  // typically sits low (0.03-0.17) even during normal listening, so
  // scaling the *reach* by it meant the glow only ever got big enough to
  // hit the card's center on a rare near-maximum peak, leaving the center
  // permanently black otherwise. Large fixed spread/blur means the wash
  // always reaches the full card regardless of size; only ALPHA (how
  // visible it is) responds to the music, which is what actually needs to
  // "flash". Low max alpha keeps it subtle so it doesn't compete with the
  // spectrum/glow visualizer for the same border-area attention.
  CARD_FLASH_GLOW_BLUR:   100,   // inset glow blur radius (px) — fixed, soft edge transition
  CARD_FLASH_GLOW_SPREAD: 250,   // inset glow spread (px) — fixed, reaches well past center on typical card sizes
  CARD_FLASH_GLOW_ALPHA:  0.35,  // inset glow opacity (white) at full signal — this is what pulses with the music

  // ── MIRRORED GLOW (outward bleed) ────────────────────────────
  // Opt-in second copy of the border visualizer drawn OUTSIDE the card,
  // so the glow bleeds past the edge instead of stopping at the hard cut
  // produced by .card-wrap's overflow:hidden. That clip STAYS — it is
  // what crops the inner glow, and the inner glow is unchanged.
  //
  // Both layers go through the same drawBands() renderer, at the same 44
  // perimeter positions, reading the same smoothed visBands; only the
  // sign of the perimeter normal differs. So they are frame-locked, they
  // cannot drift apart as the look is tuned, and there is no second
  // smoothing pass and no second WebSocket read.
  //
  // The mirror lives on its own canvas BEHIND the card. The mirrored bars
  // point outward, but their blur also smears inward across the border;
  // the card's own background (rgba(0,0,0,0.97) — effectively opaque)
  // occludes that smear. Bleed outside, today's look inside, and because
  // nothing is masked there is no seam at the border.
  //
  // OFF by default: with no `mirror` flag no element is created, no 2D
  // context is allocated and nothing extra is drawn per frame.
  MIRROR:         false,
  MIRROR_SIZE:    22,    // outward bar depth (px) — matches VIS_BAR_DEPTH
  MIRROR_OPACITY: 0.55,  // layer opacity — CSS opacity on the canvas, GPU-composited
  MIRROR_BLUR:    12,    // blur radius (px) — matches VIS_BLUR so the outward
                         // bleed is a true mirror of the inner glow's softness

  // ── RENDER RATE CAP ──────────────────────────────────────────
  // Caps how often the canvas is redrawn and bg motion is updated.
  // Server sends FFT data at 30 FPS, so anything above 30 just
  // re-renders the same data. Lower = less CPU. Set to 0 for uncapped.
  RENDER_FPS: 24,
};

// ── Runtime overrides (additive, default-preserving) ──
// Optional URL query params let a second OBS browser source (or the GUI)
// change ports / enable pause-hide / re-skin the card WITHOUT editing this
// file. With NO params (the default OBS URL http://localhost:8081/) every
// value below is byte-for-behaviour identical to today: ENDPOINT/bg-list
// keep :8081, SPECTRUM_PORT keeps 9001, and the card never hides on pause.
CONFIG.OVERLAY_PORT     = '8081';
CONFIG.HIDE_WHEN_PAUSED = false;
(function applyRuntimeOverrides() {
  try {
    const q = new URLSearchParams(location.search);
    const overlayPort = q.get('port');
    const specPort    = q.get('spectrumPort');
    if (overlayPort) {
      CONFIG.OVERLAY_PORT = overlayPort;
      // Spotify keeps its own metadata path — only the port is inherited
      // from the flag (the reference overlay rebuilds a Beefweb path here).
      CONFIG.ENDPOINT = `http://localhost:${overlayPort}/api/spotify/current`;
    }
    if (specPort) CONFIG.SPECTRUM_PORT = parseInt(specPort, 10) || CONFIG.SPECTRUM_PORT;
    CONFIG.HIDE_WHEN_PAUSED = q.get('hideWhenPaused') === '1';

    // ── Per-scene look overrides (additive, default-preserving) ──
    // Let a second OBS browser source (e.g. a BRB/intermission scene) render
    // a differently-sized/opacity/motion card without touching the default
    // gaming-scene source, which passes none of these params.
    const rootStyle    = document.documentElement.style;
    const cardWidth     = parseFloat(q.get('cardWidth'));
    const cardHeight    = parseFloat(q.get('cardHeight'));
    const cardRadius    = parseFloat(q.get('cardRadius'));
    const cardOpacity   = parseFloat(q.get('cardOpacity'));
    const imgOpacityVal = parseFloat(q.get('imgOpacity'));
    const bgMotion       = q.get('bgMotion');

    if (!isNaN(cardWidth))   rootStyle.setProperty('--card-width', cardWidth + 'px');
    if (!isNaN(cardHeight))  rootStyle.setProperty('--card-height', cardHeight + 'px');
    // --card-radius is shared by .card, .card-wrap and #vis-canvas, so one
    // root-level override keeps the card, its clip and the glow canvas in sync.
    if (!isNaN(cardRadius))  rootStyle.setProperty('--card-radius', cardRadius + 'px');
    if (!isNaN(cardOpacity)) rootStyle.setProperty('--card-bg', `rgba(0, 0, 0, ${cardOpacity})`);
    if (!isNaN(imgOpacityVal)) rootStyle.setProperty('--img-opacity', String(imgOpacityVal));
    if (bgMotion === '1') CONFIG.BG_MOTION = true;
    else if (bgMotion === '0') CONFIG.BG_MOTION = false;

    if (q.get('bgMotionTarget') === 'card') CONFIG.BG_MOTION_TARGET = 'card';

    // Mirrored outward glow — see the MIRRORED GLOW block in CONFIG.
    // Absent or unparseable values fall through to the defaults.
    const mirrorSize    = parseFloat(q.get('mirrorSize'));
    const mirrorOpacity = parseFloat(q.get('mirrorOpacity'));
    const mirrorBlur    = parseFloat(q.get('mirrorBlur'));
    if (q.get('mirror') === '1') CONFIG.MIRROR = true;
    if (!isNaN(mirrorSize))    CONFIG.MIRROR_SIZE    = mirrorSize;
    if (!isNaN(mirrorOpacity)) CONFIG.MIRROR_OPACITY = mirrorOpacity;
    if (!isNaN(mirrorBlur))    CONFIG.MIRROR_BLUR    = mirrorBlur;
  } catch (_) { /* keep defaults */ }
})();

// ── Elements ───────────────────────────────────────────────────
const cardWrap  = document.getElementById('card-wrap');
const stage     = document.getElementById('stage');
const card      = document.getElementById('card');
const elArtist  = document.getElementById('artist');
const elTrack   = document.getElementById('track');
const elTimer   = document.getElementById('timer');
const elFill    = document.getElementById('progress-fill');
const bgA       = document.getElementById('bg-a');
const bgB       = document.getElementById('bg-b');
const artistClip= document.getElementById('artist-clip');
const trackClip = document.getElementById('track-clip');

let imgQueue = [], allImages = [], activeLayer = 'a', lastTitle = '';
let visGain  = 1.0;  // dynamic gain multiplier derived from foobar volume

// ── METADATA ADAPTER (Spotify) ── start
//   Spotify-specific state + static visualizer gain. Reference uses Beefweb +
//   a volume-derived dynamic visGain here; Spotify has no volume, so VIS_GAIN
//   is a user-set static multiplier (FR-019). Track identity is keyed off the
//   Spotify track id; playback position is interpolated between polls.
let lastTrackId    = '';
let lastProgressMs = 0;
let lastProgressAt = 0;
let isPlaying      = false;
visGain = CONFIG.VIS_GAIN;   // static gain; engine's connectSpectrum reads visGain unchanged
// ── METADATA ADAPTER (Spotify) ── end

// (#1) Apply VIS_BLUR + VIS_BRIGHTNESS as a chained CSS filter (GPU-composited)
document.getElementById('vis-canvas').style.setProperty(
  '--vis-filter',
  `blur(${CONFIG.VIS_BLUR}px) brightness(${CONFIG.VIS_BRIGHTNESS})`
);

// Card glass blur — operator toggle. When on, reproduces the baseline
// backdrop-filter exactly (radius read from --card-blur); when off, no
// backdrop pass at all. Missing/invalid flag falls back to off.
if (CONFIG.CARD_BACKDROP_BLUR) {
  const cardBlur = getComputedStyle(document.documentElement)
    .getPropertyValue('--card-blur').trim() || '22px';
  card.style.setProperty('backdrop-filter', `blur(${cardBlur})`);
  card.style.setProperty('-webkit-backdrop-filter', `blur(${cardBlur})`);
}

// (#4) Cache card radius — never changes at runtime
const cachedCardRadius = parseFloat(getComputedStyle(document.documentElement)
  .getPropertyValue('--card-radius')) || 20;

// (#5) Parse VIS_COLOR once
const [VIS_CR, VIS_CG, VIS_CB] = CONFIG.VIS_COLOR.split(',').map(s => s.trim());

// (#7) Read base CSS values for bg-img once for direct style writes
const bgBaseScale = parseFloat(getComputedStyle(document.documentElement)
  .getPropertyValue('--img-scale')) || 1.06;
const bgBaseBlur  = parseFloat(getComputedStyle(document.documentElement)
  .getPropertyValue('--img-blur'))  || 1;

// (#8) Visibility tracking for rAF pause
let cardVisible = false;
let rafId       = null;

// ── Images ─────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function nextImage() {
  if (!CONFIG.IMAGES || !allImages.length) return;
  if (!imgQueue.length) imgQueue = shuffle(allImages);
  const src      = imgQueue.pop();
  const incoming = activeLayer === 'a' ? bgB : bgA;
  const outgoing = activeLayer === 'a' ? bgA : bgB;
  incoming.src = src;
  incoming.onload = () => {
    incoming.classList.add('active');
    outgoing.classList.remove('active');
    activeLayer = activeLayer === 'a' ? 'b' : 'a';
  };
}

async function loadImageList() {
  if (!CONFIG.IMAGES) return;
  try {
    const res   = await fetch(`http://localhost:${CONFIG.OVERLAY_PORT}/bg-list`, { cache: 'no-store' });
    const files = await res.json();
    if (!files.length) return;
    allImages = files;
    imgQueue  = shuffle(allImages);
    const first = imgQueue.pop();
    bgA.src = first;
    bgA.onload = () => bgA.classList.add('active');
  } catch (_) {}
}

loadImageList();

// ── Marquee ─────────────────────────────────────────────────────
function applyMarquee(clip, inner) {
  clip.classList.remove('scrolling');
  inner.style.removeProperty('--marquee-offset');
  clip.style.webkitMaskImage = '';
  clip.style.maskImage = '';
  requestAnimationFrame(() => {
    const overflow = inner.scrollWidth - clip.clientWidth;
    if (overflow > 2) {
      inner.style.setProperty('--marquee-offset', `-${overflow}px`);
      clip.classList.add('scrolling');
    }
  });
}

// ── Helpers ─────────────────────────────────────────────────────
function fmtTime(s) {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ':' + (s % 60).toString().padStart(2, '0');
}

// ── METADATA ADAPTER (Spotify) ── start
//   Album-art-as-background crossfade + the Spotify UI update. These feed the
//   SAME engine entry points the reference's data path feeds (the bg-a/bg-b
//   crossfade layers, the card text setters, the marquee, the rAF loop) — they
//   do not fork the rendering engine. Reference supplies these from Beefweb.

// Album art → engine background slot. Rides the same bg-a/bg-b crossfade
// layers (and decoding="async") IMAGES uses, so it shares the async-decode
// path (FR-005). Mutually exclusive with the local-bg IMAGES source.
function setAlbumArt(url) {
  if (!CONFIG.ALBUM_ART_BG || !url) return;
  const incoming = activeLayer === 'a' ? bgB : bgA;
  const outgoing = activeLayer === 'a' ? bgA : bgB;
  incoming.src = url;
  incoming.onload = () => {
    incoming.classList.add('active');
    outgoing.classList.remove('active');
    activeLayer = activeLayer === 'a' ? 'b' : 'a';
  };
}

// ── UI update ───────────────────────────────────────────────────
// Spotify shape: trackId-keyed new-track detection, ms timings, album art.
function updateUI({ trackId, artist, title, artUrl, progressMs, durationMs, playing }) {
  const isNewTrack = trackId !== lastTrackId;
  if (isNewTrack) {
    elArtist.classList.add('fade-out');
    elTrack.classList.add('fade-out');
    setTimeout(() => {
      elArtist.textContent = artist || '—';
      elTrack.textContent  = title  || '—';
      elArtist.classList.remove('fade-out');
      elTrack.classList.remove('fade-out');
      applyMarquee(artistClip, elArtist);
      applyMarquee(trackClip,  elTrack);
    }, 160);
    setAlbumArt(artUrl);
    nextImage();
    lastTrackId = trackId;
  }

  // Progress interpolation between polls (Spotify polls ~1/s)
  lastProgressMs = progressMs;
  lastProgressAt = Date.now();
  isPlaying      = playing;

  // fmtTime() (shared engine) takes SECONDS — convert from Spotify ms
  elTimer.textContent = fmtTime(progressMs / 1000) + ' / ' + fmtTime(durationMs / 1000);
  elFill.style.width  = durationMs > 0 ? Math.min(100, (progressMs / durationMs) * 100) + '%' : '0%';

  // (#8) Track visibility and start/stop rAF loop
  if (!cardVisible) {
    cardVisible = true;
    card.classList.add('visible');
    startAnimationLoop();
  }
}
// ── METADATA ADAPTER (Spotify) ── end

// (#8) Hide card and stop rAF when nothing is playing
function hideCard() {
  if (cardVisible) {
    cardVisible = false;
    card.classList.remove('visible');
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }
}

// ── Background FFT motion (independent system) ─────────────────
// Separate FFT consumer for background image only.
// - Groups incoming FFT into broad bands
// - Shapes signal with a curve to soften low-level chatter
// - Uses delayed targets + inertia so motion trails behind glow

const BG_MOTION_TARGET = CONFIG.BG_MOTION_TARGET;
const BG_BAND_GROUPS = CONFIG.BG_MOTION_BANDS;
const bgGroupedBands = new Array(BG_BAND_GROUPS).fill(0);
let bgDelayedLow  = 0, bgDelayedMid  = 0, bgDelayedHigh = 0;
let bgZoomValue   = 1, bgBlurValue   = CONFIG.BG_BASE_BLUR, bgMicroValue = 0;
// 'card' mode doesn't touch the background image at all, so it must not
// depend on CONFIG.IMAGES; 'image' mode is unchanged (still requires it).
const bgEnabled   = CONFIG.BG_MOTION && (BG_MOTION_TARGET === 'card' || CONFIG.IMAGES);

// Soft shaping to reduce chatter/spikes and keep motion subtle
function bgShape(v) {
  const clamped = Math.max(0, Math.min(1, v));
  return Math.pow(clamped, 1.55);
}

// Group 64 server bands into 6 broad bands
function bgRegroup(src) {
  if (!bgEnabled || !Array.isArray(src) || !src.length) return;
  for (let i = 0; i < BG_BAND_GROUPS; i++) {
    const start = Math.floor(i * src.length / BG_BAND_GROUPS);
    const end   = Math.max(start + 1, Math.floor((i + 1) * src.length / BG_BAND_GROUPS));
    let sum = 0;
    for (let j = start; j < end; j++) sum += src[j] || 0;
    bgGroupedBands[i] = sum / (end - start);
  }
}

function bgAnimate(t) {
  if (!bgEnabled) return;

  // Broad frequency mapping (shared by both motion targets):
  // - bass drives slow zoom (image target only)
  // - mids drive blur (both targets)
  // - highs add tiny, heavily-smoothed micro-variation (image target only)
  const lowRaw  = (bgGroupedBands[0] * 0.72) + (bgGroupedBands[1] * 0.28);
  const midRaw  = (bgGroupedBands[2] * 0.55) + (bgGroupedBands[3] * 0.45);
  const highRaw = (bgGroupedBands[4] * 0.45) + (bgGroupedBands[5] * 0.55);

  // Shape + soft clamp so peaks do not snap the target
  const lowTarget  = Math.min(0.95, bgShape(lowRaw));
  const midTarget  = Math.min(0.85, bgShape(midRaw) * 0.9);
  const highTarget = Math.min(0.70, bgShape(highRaw) * 0.7);

  // Intentional response delay: motion trails the foreground glow
  bgDelayedLow  += (lowTarget  - bgDelayedLow)  * CONFIG.BG_DELAY_SMOOTH;
  bgDelayedMid  += (midTarget  - bgDelayedMid)  * (CONFIG.BG_DELAY_SMOOTH * 1.15);
  bgDelayedHigh += (highTarget - bgDelayedHigh) * (CONFIG.BG_DELAY_SMOOTH * 0.9);

  if (BG_MOTION_TARGET === 'card') {
    // No zoom here — scaling the card would visibly distort its text/border,
    // unlike the invisible background image. Deliberately an ADDITIVE inset
    // glow (box-shadow), NOT `filter: brightness()` — see the
    // CARD_FLASH_GLOW_BLUR comment in CONFIG for why brightness() can't
    // work here (multiplicative on a black background).
    //
    // Driven by bgDelayedMid — a gentle continuous wash synced to the mids,
    // not a sharp peak flash. Reach (blur/spread) is fixed so the wash
    // always covers the full card; only alpha responds to the music.
    const glowAlpha = bgDelayedMid * CONFIG.CARD_FLASH_GLOW_ALPHA;

    card.style.setProperty('box-shadow',
      `inset 0 0 ${CONFIG.CARD_FLASH_GLOW_BLUR}px ${CONFIG.CARD_FLASH_GLOW_SPREAD}px rgba(255, 255, 255, ${glowAlpha})`);
    return;
  }

  // ── 'image' target (default, unchanged from before this feature) ──
  // Slow baseline breathing independent of FFT
  const baselineZoom = 1 + CONFIG.BG_BASELINE_ZOOM * (0.5 + 0.5 * Math.sin(t * 0.16));

  // Tiny high-band variation, smoothed enough to avoid visual noise
  bgMicroValue += (bgDelayedHigh - bgMicroValue) * CONFIG.BG_MICRO_SMOOTH;

  // Map FFT → zoom/blur
  const zoomTarget = baselineZoom + (bgDelayedLow * CONFIG.BG_ZOOM_MAX_ADD) + (bgMicroValue * 0.0015);
  const blurTarget = CONFIG.BG_BASE_BLUR + (bgDelayedMid * CONFIG.BG_BLUR_MAX_ADD) + (bgMicroValue * 0.06);

  // Inertia smoothing — zoom is slower than blur so it feels deeper/heavier
  bgZoomValue += (zoomTarget - bgZoomValue) * CONFIG.BG_ZOOM_SMOOTH;
  bgBlurValue += (blurTarget - bgBlurValue) * CONFIG.BG_BLUR_SMOOTH;

  // (#7) Write directly to active bg-img elements, bypassing CSS variable resolution
  const finalScale = bgBaseScale * bgZoomValue;
  const finalBlur  = bgBaseBlur + bgBlurValue;
  const transformStr = `scale(${finalScale})`;
  const filterStr    = `blur(${finalBlur}px)`;

  if (bgA.classList.contains('active')) {
    bgA.style.transform = transformStr;
    bgA.style.filter    = filterStr;
  }
  if (bgB.classList.contains('active')) {
    bgB.style.transform = transformStr;
    bgB.style.filter    = filterStr;
  }
}

// ── Visualizer ─────────────────────────────────────────────────
const visCanvas  = document.getElementById('vis-canvas');
const visCtx     = visCanvas.getContext('2d');
const VIS_BANDS  = CONFIG.VIS_BANDS;
const visBands   = new Float64Array(VIS_BANDS);  // smoothed
const visRaw     = new Float64Array(VIS_BANDS);  // raw from WebSocket

// ── MIRRORED GLOW ────────────────────────────────────────────────
// Built only when the mirror is enabled. When off, mirrorCanvas stays
// null, no element is created, no 2D context is allocated, and
// mirrorDraw() is never called — the page is exactly as it was.
const mirrorOn = CONFIG.VISUALIZER && CONFIG.MIRROR;

// Visible reach is roughly the bar depth plus about twice the blur
// radius. The canvas is inset by -MIRROR_MARGIN on all four sides so
// the blur isn't clipped, and body padding grows to match so the bleed
// isn't cut off by the top/left edge of the OBS browser source. Growing
// the padding is what creates that room, so with the mirror on the card
// sits (MIRROR_MARGIN - 16)px further down-right in the page than it
// does today — nudge that scene's browser source once to compensate.
const MIRROR_MARGIN = mirrorOn
  ? Math.ceil(Math.max(16, CONFIG.MIRROR_SIZE + 2 * CONFIG.MIRROR_BLUR))
  : 0;

let mirrorCanvas = null;
let mirrorCtx    = null;

if (mirrorOn) {
  mirrorCanvas = document.createElement('canvas');
  mirrorCanvas.id = 'vis-mirror';
  // left/top/width/height (not inset — see visResize()) are set from
  // script once the inner canvas's bitmap size is known.
  mirrorCanvas.style.opacity = String(CONFIG.MIRROR_OPACITY);
  // Same GPU-composited chained filter the inner canvas uses — not a
  // per-stroke ctx.filter.
  mirrorCanvas.style.filter  =
    `blur(${CONFIG.MIRROR_BLUR}px) brightness(${CONFIG.VIS_BRIGHTNESS})`;
  // Insert BEFORE .card-wrap so paint order follows DOM order and the
  // card plus the untouched inner glow stay on top. The mirror is also
  // masked to the region OUTSIDE the card (see applyMirrorMask), so it
  // cannot paint over the card at all.
  stage.insertBefore(mirrorCanvas, cardWrap);
  mirrorCtx = mirrorCanvas.getContext('2d');
  // Reserve page room so the outward bleed isn't clipped at the edge.
  document.body.style.padding = `${MIRROR_MARGIN}px`;
}

// Hard-cut the mirror at the card's edge, mirroring how .card-wrap's
// overflow:hidden crops the inner glow — same cut, opposite side.
//
// This MUST be an element-level mask, not an in-canvas erase. MIRROR_BLUR
// is a CSS filter on the element, and CSS applies filter BEFORE mask, so
// the mask cuts the already-blurred result. Erasing inside the bitmap
// instead would just let the blur smear the soft edge back over the card
// — which is the artifact this removes.
//
// The mask is an SVG whose viewBox is in mirror-BITMAP units with
// preserveAspectRatio="none", plus mask-size:100% 100%. That maps bitmap
// units onto the element box exactly the way the canvas bitmap itself is
// mapped, so the cut stays pixel-locked to the glow through the live
// webfont stretch described in visResize().
function applyMirrorMask() {
  const EW = mirrorCanvas.width;
  const EH = mirrorCanvas.height;
  const M  = MIRROR_MARGIN;
  const W  = visCanvas.width;
  const H  = visCanvas.height;
  // Same radius the glow geometry uses, so the knockout follows the exact
  // curve the bars are laid out along. Clamped like a CSS corner radius.
  const R  = Math.max(0, Math.min(cachedCardRadius, W / 2, H / 2));

  const hole = R > 0
    ? `M${M + R},${M}` +
      `H${M + W - R}A${R},${R} 0 0 1 ${M + W},${M + R}` +
      `V${M + H - R}A${R},${R} 0 0 1 ${M + W - R},${M + H}` +
      `H${M + R}A${R},${R} 0 0 1 ${M},${M + H - R}` +
      `V${M + R}A${R},${R} 0 0 1 ${M + R},${M}Z`
    : `M${M},${M}H${M + W}V${M + H}H${M}Z`;

  // fill-rule="evenodd" turns the inner subpath into a hole: opaque
  // everywhere outside the card, fully transparent inside it.
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${EW} ${EH}" ` +
    `preserveAspectRatio="none">` +
    `<path fill="#fff" fill-rule="evenodd" ` +
    `d="M0,0H${EW}V${EH}H0Z${hole}"/></svg>`;
  const url = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;

  mirrorCanvas.style.maskImage        = url;
  mirrorCanvas.style.webkitMaskImage  = url;
  mirrorCanvas.style.maskSize         = '100% 100%';
  mirrorCanvas.style.webkitMaskSize   = '100% 100%';
  mirrorCanvas.style.maskRepeat       = 'no-repeat';
  mirrorCanvas.style.webkitMaskRepeat = 'no-repeat';
}

// (#9) Precomputed band positions — recalculated on resize only
let bandPositions = null;  // [{x, y, nx, ny}, ...]
let cachedBarW    = 3;

function computeBandPositions() {
  const W = visCanvas.width;
  const H = visCanvas.height;
  const R = cachedCardRadius;
  const straightW = W - 2 * R;
  const straightH = H - 2 * R;
  const perimeter = 2 * straightW + 2 * straightH + Math.PI * 2 * R;
  const bandStep  = perimeter / VIS_BANDS;

  cachedBarW = Math.max(3, bandStep * 1.2);
  bandPositions = new Array(VIS_BANDS);

  for (let i = 0; i < VIS_BANDS; i++) {
    const dist = i * bandStep + bandStep * 0.5;
    let x, y, nx, ny;

    if (dist < straightW) {
      x = R + dist; y = 0; nx = 0; ny = 1;
    } else if (dist < straightW + Math.PI * 0.5 * R) {
      const a = (dist - straightW) / R;
      x = W - R + Math.sin(a) * R; y = R - Math.cos(a) * R;
      nx = -Math.sin(a); ny = -Math.cos(a);
    } else if (dist < straightW + Math.PI * 0.5 * R + straightH) {
      const d = dist - straightW - Math.PI * 0.5 * R;
      x = W; y = R + d; nx = -1; ny = 0;
    } else if (dist < straightW + Math.PI * R + straightH) {
      const a = (dist - straightW - Math.PI * 0.5 * R - straightH) / R;
      x = W - R + Math.cos(a) * R; y = H - R + Math.sin(a) * R;
      nx = -Math.cos(a); ny = -Math.sin(a);
    } else if (dist < 2 * straightW + Math.PI * R + straightH) {
      const d = dist - straightW - Math.PI * R - straightH;
      x = W - R - d; y = H; nx = 0; ny = -1;
    } else if (dist < 2 * straightW + Math.PI * 1.5 * R + straightH) {
      const a = (dist - 2 * straightW - Math.PI * R - straightH) / R;
      x = R - Math.sin(a) * R; y = H - R + Math.cos(a) * R;
      nx = Math.sin(a); ny = -Math.cos(a);
    } else if (dist < 2 * straightW + Math.PI * 1.5 * R + 2 * straightH) {
      const d = dist - 2 * straightW - Math.PI * 1.5 * R - straightH;
      x = 0; y = H - R - d; nx = 1; ny = 0;
    } else {
      const a = (dist - 2 * straightW - Math.PI * 1.5 * R - 2 * straightH) / R;
      x = R - Math.cos(a) * R; y = R - Math.sin(a) * R;
      nx = Math.cos(a); ny = Math.sin(a);
    }

    bandPositions[i] = { x, y, nx, ny };
  }
}

// Size canvas to match card
function visResize() {
  visCanvas.width  = cardWrap.offsetWidth;
  visCanvas.height = cardWrap.offsetHeight;
  computeBandPositions();
  if (mirrorCanvas) {
    // Bitmap stays pinned to the inner canvas's own bitmap size (frozen
    // at whatever cardWrap measured on this call), padded by the margin.
    mirrorCanvas.width  = visCanvas.width  + 2 * MIRROR_MARGIN;
    mirrorCanvas.height = visCanvas.height + 2 * MIRROR_MARGIN;

    // #vis-canvas gets its CSS box from `width:100%; height:100%`, so it
    // silently re-stretches on every layout pass to match cardWrap's
    // LIVE size — including any growth a webfont swap adds after this
    // very call, well before any 'resize' event could fire again. Its
    // bitmap (set two lines above) never gets that update, so the inner
    // glow already renders at a small, pre-existing, approved stretch.
    // For the mirror to stay pixel-locked to it, its box must inherit
    // that same live stretch rather than freezing to today's cardWrap
    // size in px. Expressing left/top/width/height as percentages of
    // .stage does that: mirrorCanvas is absolutely positioned and
    // cardWrap is .stage's only in-flow child, so .stage's box always
    // equals cardWrap's current box, and percentages are re-resolved by
    // the browser on every layout — tracking the same live scale the
    // inner canvas gets for free, even though computed here only once.
    mirrorCanvas.style.left   = `${-(MIRROR_MARGIN / visCanvas.width)  * 100}%`;
    mirrorCanvas.style.top    = `${-(MIRROR_MARGIN / visCanvas.height) * 100}%`;
    mirrorCanvas.style.width  = `${(mirrorCanvas.width  / visCanvas.width)  * 100}%`;
    mirrorCanvas.style.height = `${(mirrorCanvas.height / visCanvas.height) * 100}%`;

    // Rebuilt here because it is expressed in bitmap units, which the two
    // assignments above can change.
    applyMirrorMask();
  }
}
visResize();
window.addEventListener('resize', visResize);

// Shared band renderer for both glow layers. The inner and mirrored
// glows differ only in three values — which context they paint into,
// which way the perimeter normal points, and the canvas-origin offset —
// so they go through one renderer and cannot drift apart as the look is
// tuned. Reads visBands; never writes it (smoothing is visDraw's alone).
//   ctx    — target 2D context
//   depth  — bar length in px at full amplitude
//   sign   — +1 draws inward (the original glow), -1 draws outward
//   offset — px translation, for canvases larger than the card
// The caller owns its own clearRect.
function drawBands(ctx, depth, sign, offset) {
  ctx.save();
  ctx.translate(offset, offset);

  // (#6) Reuse line settings across all bands
  ctx.lineCap = 'round';
  ctx.lineWidth = cachedBarW;

  for (let i = 0; i < VIS_BANDS; i++) {
    if (visBands[i] < 0.005) continue;

    const pos   = bandPositions[i];
    const barH  = visBands[i] * depth;
    const alpha = visBands[i] * CONFIG.VIS_MAX_OPACITY;
    const endX  = pos.x + sign * pos.nx * barH;
    const endY  = pos.y + sign * pos.ny * barH;

    // (#6) Gradient with pre-parsed color channels — (#10) no .toFixed()
    const grad = ctx.createLinearGradient(pos.x, pos.y, endX, endY);
    grad.addColorStop(0,   `rgba(${VIS_CR},${VIS_CG},${VIS_CB},${alpha})`);
    grad.addColorStop(0.4, `rgba(${VIS_CR},${VIS_CG},${VIS_CB},${alpha * 0.6})`);
    grad.addColorStop(1,   `rgba(${VIS_CR},${VIS_CG},${VIS_CB},0)`);

    ctx.beginPath();
    ctx.strokeStyle = grad;
    ctx.moveTo(pos.x, pos.y);
    ctx.lineTo(endX, endY);
    ctx.stroke();
  }

  ctx.restore();
}

function visDraw() {
  const W = visCanvas.width;
  const H = visCanvas.height;

  visCtx.clearRect(0, 0, W, H);
  // (#1) No ctx.filter — blur is handled by CSS on the canvas element

  // Smooth bands — snappy attack, gentle decay
  for (let i = 0; i < VIS_BANDS; i++) {
    const target = visRaw[i];
    const rate   = target > visBands[i]
      ? CONFIG.VIS_SMOOTHING * 4
      : CONFIG.VIS_SMOOTHING;
    visBands[i] += (target - visBands[i]) * rate;
  }

  // Inward: sign +1, no offset. This is the original render loop, now
  // shared with the mirrored layer.
  drawBands(visCtx, CONFIG.VIS_BAR_DEPTH, 1, 0);
}

// The outward layer. Same renderer, same bandPositions, same visBands
// the inner glow just smoothed — only the normal's sign and the canvas
// offset differ. Because bandPositions is shared, the mirror follows
// --card-radius automatically, including the cardRadius URL override.
function mirrorDraw() {
  mirrorCtx.clearRect(0, 0, mirrorCanvas.width, mirrorCanvas.height);
  drawBands(mirrorCtx, CONFIG.MIRROR_SIZE, -1, MIRROR_MARGIN);
}

// ── (#2) Single rAF loop ────────────────────────────────────────
// Frame interval for the render rate cap. 0 = uncapped (run at browser rAF rate).
const FRAME_INTERVAL_MS = CONFIG.RENDER_FPS > 0 ? 1000 / CONFIG.RENDER_FPS : 0;
let   lastFrameTime     = 0;

function animationLoop() {
  rafId = requestAnimationFrame(animationLoop);

  const now = performance.now();
  // Gate: skip work if not enough time has elapsed since last render.
  // The 0.5ms epsilon prevents missing frames due to rAF/vsync alignment.
  if (FRAME_INTERVAL_MS > 0 && (now - lastFrameTime) < (FRAME_INTERVAL_MS - 0.5)) return;
  lastFrameTime = now;

  const t = now * 0.001;

  // Background motion (uses its own config/state/smoothing)
  bgAnimate(t);

  // Visualizer canvas draw
  if (CONFIG.VISUALIZER) {
    visDraw();
    // Must run AFTER visDraw — it consumes the visBands values visDraw
    // just smoothed, which is what keeps the two layers frame-locked.
    if (mirrorOn) mirrorDraw();
  }
}

// (#8) Start/stop helpers
function startAnimationLoop() {
  if (rafId === null) {
    lastFrameTime = 0;  // ensure first frame after restart renders immediately
    rafId = requestAnimationFrame(animationLoop);
  }
}

// ── (#3) Shared WebSocket connection ────────────────────────────
function connectSpectrum() {
  if (!CONFIG.VISUALIZER && !bgEnabled) return;

  const ws = new WebSocket(`ws://localhost:${CONFIG.SPECTRUM_PORT}`);

  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      if (!Array.isArray(data)) return;

      // Feed visualizer (44 bands, own gain)
      if (CONFIG.VISUALIZER) {
        for (let i = 0; i < VIS_BANDS; i++) {
          const idx = Math.floor(i * data.length / VIS_BANDS);
          visRaw[i] = Math.min(1, (data[idx] || 0) * visGain);
        }
      }

      // Feed background motion (6 broad bands, own regroup/shaping)
      bgRegroup(data);
    } catch (_) {}
  };

  ws.onclose = () => setTimeout(connectSpectrum, 3000);
  ws.onerror = () => {};
}

// ── METADATA ADAPTER (Spotify) ── start
//   Poll api/spotify/current, parse the Spotify currently-playing shape, and
//   interpolate progress between polls. Reference polls Beefweb here. Degraded
//   states ({"is_playing":false} / errors) hide the card via the shared hideCard().

// ── Fetch ───────────────────────────────────────────────────────
async function fetchNowPlaying() {
  try {
    const res  = await fetch(CONFIG.ENDPOINT, { cache: 'no-store' });
    const data = await res.json();
    if (!data.is_playing && !data.item) { hideCard(); isPlaying = false; return; }
    // hideWhenPaused: treat a paused-but-loaded track like a hidden state,
    // matching the reference overlay's playbackState==='paused' behaviour.
    if (CONFIG.HIDE_WHEN_PAUSED && !data.is_playing) { hideCard(); isPlaying = false; return; }
    const item = data.item;
    updateUI({
      trackId:    item.id,
      artist:     item.artists?.map(a => a.name).join(', ') || '—',
      title:      item.name || '—',
      artUrl:     item.album?.images?.[0]?.url || '',
      progressMs: data.progress_ms || 0,
      durationMs: item.duration_ms || 0,
      playing:    data.is_playing,
    });
  } catch (_) { hideCard(); isPlaying = false; }
}

// Smooth timer tick — interpolate the position locally between polls
function tickTimer() {
  if (!isPlaying || lastProgressAt === 0) return;
  const current = lastProgressMs + (Date.now() - lastProgressAt);
  elTimer.textContent = fmtTime(current / 1000) + ' / ' + elTimer.textContent.split(' / ')[1];
}
setInterval(tickTimer, 250);

// ── Demo mode ──────────────────────────────────────────────────
const DEMO_TRACKS = [
  { id: '1', artist: 'Floating Points', title: 'LesAlpx',        duration: 272000 },
  { id: '2', artist: 'Burial',          title: 'Archangel',      duration: 196000 },
  { id: '3', artist: 'Four Tet',        title: 'Angel Echoes',   duration: 263000 },
  { id: '4', artist: 'Jon Hopkins',     title: 'Open Eye Signal', duration: 475000 },
];
let demoIdx = 0, demoPos = 0;

function runDemo() {
  const t = DEMO_TRACKS[demoIdx];
  updateUI({ trackId: t.id, artist: t.artist, title: t.title, artUrl: '',
             progressMs: demoPos, durationMs: t.duration, playing: true });
  demoPos += 1000;
  if (demoPos >= t.duration) { demoPos = 0; demoIdx = (demoIdx + 1) % DEMO_TRACKS.length; }
}

if (CONFIG.DEMO_MODE) {
  runDemo();
  setInterval(runDemo, CONFIG.POLL_MS);
} else {
  fetchNowPlaying();
  setInterval(fetchNowPlaying, CONFIG.POLL_MS);
}
// ── METADATA ADAPTER (Spotify) ── end

// ── Initialize bg-img baseline (#7) ─────────────────────────────
// Set initial transform/filter directly so images don't start unstyled
const initTransform = `scale(${bgBaseScale})`;
const initFilter    = `blur(${bgBaseBlur + CONFIG.BG_BASE_BLUR}px)`;
bgA.style.transform = initTransform;
bgA.style.filter    = initFilter;
bgB.style.transform = initTransform;
bgB.style.filter    = initFilter;

// ── Start spectrum connection ───────────────────────────────────
connectSpectrum();
</script>
